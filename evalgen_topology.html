    .pulse-ring {
      animation: pulseRing 2.4s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashFlow 1.6s linear infinite;
    }
    .flow-reverse {
      stroke-dasharray: 6 6;
      animation: dashFlow 1.6s linear infinite reverse;
