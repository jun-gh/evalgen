<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("evalgen_theme");
          const theme = stored === "light" ? "light" : "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="color-scheme"]').content = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.querySelector('meta[name="color-scheme"]').content = "light";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvalGen - AI Evaluation & Benchmarking Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="h-full antialiased font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="app" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
